readme = "README.md"
authors = [
    { name = "Vqd2k6", email = "Vqd2k6@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.0",
